<style>
:root{--bg:#f4f6f5;--cd:#fff;--tx:#18222a;--mu:#5d6b75;--ac:#0b6e63;--ac2:#e6f2f0;--bd:#d8dfe2;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html,body{margin:0}

<nav id="nav"></nav><main id="m"></main>
<script>
const $=s=>document.querySelector(s),uid=()=>crypto.randomUUID();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const DIFF={e:['سهل',.8],m:['متوسط',1],h:['صعب',1.3]};
const ymd=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
const add=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return ymd(x)};
const today=()=>ymd(new Date(Date.now()-4*36e5)); // day starts 4 AM
const dow=d=>new Date(d+'T12:00').getDay();
const D=d=>'<bdi dir="ltr">'+d+'</bdi>';
const nz=s=>String(s).trim().replace(/\s+/g,' ').toLowerCase();
// ---- storage (IndexedDB, one record) ----
const idb=()=>new Promise((r,j)=>{const q=indexedDB.open('medtrack',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
const get=async k=>{const d=await idb();return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result)})};
const put=async(k,v)=>{const d=await idb();return new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>r()})};
let S,V='today',warn='',P=null,Q=null,QP=null,QJ='';
const fresh=()=>({v:2,subjects:[],exams:[],topics:[],tasks:[],sessions:[],books:[],questions:[],attempts:[],timer:null,cnt:0,lastExport:null,def:null,qpost:null,
 set:{mins:[120,120,120,120,120,0,120],mpp:2,maxTask:60,focus:25,short:5,long:15,every:4,auto:false,sound:true,revOn:true,rev:[1,3,7,14,30]}});
// fills in any field an older saved version does not have (never removes data)
function mig(s){const f=fresh();for(const k of Object.keys(f))if(s[k]===undefined)s[k]=f[k];s.set={...f.set,...s.set};
 s.topics.forEach(t=>{t.ex=!!t.ex;t.off=t.off||0});s.v=2;return s}
const save=()=>put('state',S).catch(()=>{warn='تعذر الحفظ على هذا المتصفح'});
// ---- scheduler (pure, deterministic) ----
// roll=true: overdue tasks are re-planned (used only by "I am behind" after confirmation). Otherwise they are kept as they are.
function plan(S,t,roll){
 const st=S.set,kept=S.tasks.filter(x=>x.status==='done'||x.pinned||(!roll&&x.date<t));
 const pend=kept.filter(x=>x.status!=='done');
 const ex=S.exams.filter(e=>e.date>=t).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id<b.id?-1:1);
 const hor=ex.length?ex[ex.length-1].date:add(t,60);
 const days=[];for(let d=t;d<=hor;d=add(d,1))days.push(d);
 const cap=d=>Math.min(+st.mins[dow(d)]||0,9999),used={};
 days.forEach(d=>used[d]=0);pend.forEach(x=>{if(used[x.date]!=null)used[x.date]+=x.min});
 const sub=id=>S.subjects.find(s=>s.id===id)||{priority:2};
 const exOf=x=>ex.find(e=>e.subjectId===x.subjectId);
 const out=[],def=[],rdef=[];
 // revisions of completed topics (fixed ids => never duplicated)
 if(st.revOn){const have=new Set(kept.map(x=>x.id));
  for(const x of S.topics.filter(x=>!x.ex&&x.pages>0&&x.done>=x.pages&&x.doneDate).sort((a,b)=>a.id<b.id?-1:1)){
   const e=exOf(x),last=e?add(e.date,-1):hor,m=Math.min(st.maxTask,Math.max(5,Math.round(x.pages*st.mpp*.25)));
   for(const n of st.rev){const id='rev_'+x.id+'_'+n;if(have.has(id))continue;
    let from=add(x.doneDate,n);if(from<t)from=t;let ok=false;
    for(const d of days){if(d<from)continue;if(d>last)break;
     if(cap(d)-used[d]>=m){out.push({id,topicId:x.id,date:d,p1:1,p2:x.pages,min:m,type:'rev',status:'todo',pinned:false});used[d]+=m;ok=true;break}}
    if(!ok)rdef.push({topic:x.name,n})}}}
 const tops=S.topics.filter(x=>x.pages>x.done&&!x.ex).map(x=>({x,e:exOf(x)}))
  .sort((a,b)=>{const k=(o)=>[o.e?o.e.date:'9999',-sub(o.x.subjectId).priority,-DIFF[o.x.diff][1],o.x.name,o.x.id];
   const A=k(a),B=k(b);for(let i=0;i<A.length;i++)if(A[i]!==B[i])return A[i]<B[i]?-1:1;return 0});
 let req=0;
 for(const{x,e}of tops){
  const per=st.mpp*DIFF[x.diff][1],mp=Math.max(0,...pend.filter(p=>p.topicId===x.id&&p.type!=='rev').map(p=>p.p2));
  let cur=Math.max(x.done,mp)+1;const end=x.pages;req+=(end-cur+1)*per;
  const last=e?add(e.date,-1):hor;
  for(const d of days){ if(d>last||cur>end)break;
   let rem=cap(d)-used[d];
   while(cur<=end&&rem>=per){const n=Math.min(end-cur+1,Math.floor(Math.min(rem,st.maxTask)/per));if(n<1)break;
    const m=Math.max(1,Math.round(n*per));
    out.push({id:x.id+'_'+cur,topicId:x.id,date:d,p1:cur,p2:cur+n-1,min:m,type:'study',status:'todo',pinned:false});
    rem-=m;used[d]+=m;cur+=n}}
  if(cur<=end)def.push({topic:x.name,exam:e?e.name:'',pages:end-cur+1,min:Math.round((end-cur+1)*per)});
 }
 const avail=days.reduce((a,d)=>a+cap(d),0);
 return{tasks:[...kept,...out],def:{req:Math.round(req),avail,list:def,rev:rdef,lack:def.reduce((a,b)=>a+b.min,0)}};
}
// what would change between the current plan and a proposed one (study tasks only)
function diffTasks(oldT,newT,reason,t){
 const o=oldT.filter(x=>x.status!=='done'&&x.type!=='rev'),n=newT.filter(x=>x.status!=='done'&&x.type!=='rev'),rows=[];
 const ov=(a,b)=>a.topicId===b.topicId&&a.p1<=b.p2&&a.p2>=b.p1;
 for(const k of o){const m=n.filter(x=>ov(x,k));
  if(!m.length){rows.push({k,txt:'لا تتسع في الجدول الجديد (عجز وقت)',bad:1,why:k.date<t?'متأخرة منذ '+D(k.date):reason});continue}
  const ds=[...new Set(m.map(x=>x.date))].sort();
  if(ds.length===1&&ds[0]===k.date)continue;
  rows.push({k,txt:'تنتقل إلى '+ds.map(D).join(' و '),why:k.date<t?'متأخرة منذ '+D(k.date):reason})}
 return{rows,fresh:n.filter(x=>!o.some(k=>ov(x,k))).length};
}
function replan(roll){const r=plan(S,today(),roll);S.tasks=r.tasks;S.def=r.def;save();render()}
function propose(title,mut,roll,reason){const C=JSON.parse(JSON.stringify(S));mut(C);const t=today(),r=plan(C,t,roll);
 P={title,mut,roll,reason,r,d:diffTasks(S.tasks,r.tasks,reason,t)};V='prop';render()}
// ---- timer (timestamps are the source of truth) ----
const elapsed=(T,now=Date.now())=>now-T.start-T.pauses.reduce((a,p)=>a+p[1]-p[0],0)-(T.ps?now-T.ps:0);
const fmt=ms=>{const s=Math.max(0,Math.floor(ms/1e3));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const tk=id=>S.tasks.find(x=>x.id===id),tp=id=>S.topics.find(x=>x.id===id),sb=id=>S.subjects.find(x=>x.id===id);
function beep(){if(!S.set.sound)return;try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(d=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.2;o.connect(g);g.connect(a.destination);o.start(a.currentTime+d);o.stop(a.currentTime+d+.2)});navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
// ---- quiz (pure helpers) ----
function pickQ(S,topicIds,n=5){const last={};S.attempts.forEach(a=>{if(!last[a.questionId]||a.attemptDate>last[a.questionId])last[a.questionId]=a.attemptDate});
 return S.questions.filter(q=>!q.del&&topicIds.has(q.topicId)).sort((a,b)=>{const x=last[a.id]||'',y=last[b.id]||'';return x<y?-1:x>y?1:a.id<b.id?-1:1}).slice(0,n)}
function validateQ(raw,topics,existing){const ok=[],errs=[];let dup=0;
 if(!Array.isArray(raw))return{ok,errs:['يجب أن يكون المحتوى قائمة [ ] من الأسئلة'],dup};
 const seen=new Set(existing.filter(q=>!q.del).map(q=>q.topicId+'|'+nz(q.text)));
 raw.forEach((r,i)=>{const L='سؤال '+(i+1)+': ';
  if(!r||typeof r!=='object'||Array.isArray(r)){errs.push(L+'ليس سؤالا صالحا');return}
  const t=topics.find(x=>nz(x.name)===nz(r.topic||''));
  if(!t){errs.push(L+'الموضوع "'+r.topic+'" غير موجود. أضفه أولا بنفس الاسم');return}
  const type=r.type==='mcq'||r.type==='tf'?r.type:null;if(!type){errs.push(L+'النوع يجب أن يكون mcq أو tf');return}
  const text=String(r.question||'').trim();if(!text){errs.push(L+'نص السؤال فارغ');return}
  let opts,ans;
  if(type==='mcq'){
   if(!Array.isArray(r.options)||r.options.length<2||r.options.length>8||r.options.some(o=>typeof o!=='string'||!o.trim())){errs.push(L+'الخيارات يجب أن تكون من 2 إلى 8 نصوص غير فارغة');return}
   opts=r.options.map(o=>o.trim());
   if(!Number.isInteger(r.answer)||r.answer<0||r.answer>=opts.length){errs.push(L+'رقم الإجابة غير صحيح (يبدأ العد من 0 وأكبر قيمة هنا '+(opts.length-1)+')');return}
   ans=r.answer}
  else{if(typeof r.answer!=='boolean'){errs.push(L+'إجابة صح/خطأ يجب أن تكون true أو false');return}opts=['صح','خطأ'];ans=r.answer?0:1}
  const k=t.id+'|'+nz(text);if(seen.has(k)){dup++;return}seen.add(k);
  ok.push({id:uid(),topicId:t.id,type,text,options:opts,answer:ans,explanation:String(r.explanation||'').trim(),createdAt:Date.now()})});
 return{ok,errs,dup}}
function studiedToday(){const t=today(),ids=new Set();
 S.tasks.filter(x=>x.status==='done'&&x.doneDate===t).forEach(x=>ids.add(x.topicId));
 S.sessions.forEach(s=>{if(ymd(new Date(s.startedAt-4*36e5))===t){const id=s.topicId||tk(s.taskId)?.topicId;if(id)ids.add(id)}});return ids}
// ---- actions ----
const A={
 tab(v){V=v;P=null;render()},
 addSub(){const n=$('#sn').value.trim();if(!n)return alert('اكتب اسم المادة');S.subjects.push({id:uid(),name:n,priority:+$('#sp').value,createdAt:Date.now()});save();render()},
 addExam(){const n=$('#en').value.trim(),s=$('#es').value,d=$('#ed').value;if(!n||!s||!d)return alert('أكمل اسم الامتحان والمادة والتاريخ');S.exams.push({id:uid(),name:n,subjectId:s,date:d});replan()},
 editExam(i){const e=S.exams.find(x=>x.id===i),v=(prompt('التاريخ الجديد للامتحان بصيغة 2026-12-31',e.date)||'').trim();
  if(!v||v===e.date)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(v)||isNaN(new Date(v+'T12:00')))return alert('تاريخ غير صحيح. مثال: 2026-12-31');
  propose('تغيير موعد الامتحان: '+e.name,s=>{s.exams.find(x=>x.id===i).date=v},false,'تغيّر موعد الامتحان')},
 addBook(){const n=$('#bn').value.trim(),s=$('#bs').value,p=parseInt($('#bp').value);if(!n||!s||!(p>0))return alert('أكمل اسم الكتاب والمادة وعدد صفحاته');S.books.push({id:uid(),subjectId:s,title:n,pages:p,createdAt:Date.now()});save();render()},
 delBook(i){if(confirm('حذف الكتاب؟ تبقى المواضيع وتقدمك كما هي.')){S.books.find(b=>b.id===i).del=true;save();render()}},
 addTopic(){const n=$('#tn').value.trim(),s=$('#ts').value,bid=$('#tb').value||null;let p=parseInt($('#tp').value),off=0;
  if(bid){const b=S.books.find(x=>x.id===bid),a=parseInt($('#t1').value),z=parseInt($('#t2').value);
   if(!(a>=1&&z>=a&&z<=b.pages))return alert('مدى الصفحات غير صحيح. الكتاب فيه '+b.pages+' صفحة');p=z-a+1;off=a-1}
  if(!n||!s||!(p>0))return alert('أكمل اسم الموضوع والمادة وعدد الصفحات (رقم أكبر من 0)');
  S.topics.push({id:uid(),subjectId:s,name:n,pages:p,done:0,diff:$('#td').value,ex:false,off,bookId:bid});replan()},
 delExam(i){if(confirm('حذف هذا الامتحان؟')){S.exams=S.exams.filter(x=>x.id!==i);replan()}},
 delTopic(i){if(confirm('حذف هذا الموضوع؟ تبقى سجلات الجلسات المنجزة.')){S.topics=S.topics.filter(x=>x.id!==i);S.tasks=S.tasks.filter(x=>x.topicId!==i||x.status==='done');replan()}},
 delSub(i){if(S.topics.some(x=>x.subjectId===i)||S.exams.some(x=>x.subjectId===i))return alert('احذف مواضيع وامتحانات المادة أولا');S.subjects=S.subjects.filter(x=>x.id!==i);save();render()},
 excl(i){const t=tp(i);if(!t.ex&&!confirm('استبعاد هذا الموضوع من الجدول؟ يمكنك إعادته لاحقا ولن يُحذف شيء.'))return;t.ex=!t.ex;replan()},
 setPages(i){const t=tp(i),v=parseInt(prompt('الصفحات المنجزة في هذا الموضوع (من '+t.pages+')',t.done));if(!(v>=0&&v<=t.pages))return alert('رقم غير صحيح');t.done=v;if(v>=t.pages){t.doneDate=t.doneDate||today()}else delete t.doneDate;replan()},
 start(i){if(S.timer)return alert('هناك مؤقت يعمل بالفعل');S.timer={mode:'focus',taskId:i,start:Date.now(),pauses:[],ps:null,dur:S.set.focus*6e4};save();render()},
 brk(){const long=S.cnt>0&&S.cnt%S.set.every===0;S.timer={mode:'break',start:Date.now(),pauses:[],ps:null,dur:(long?S.set.long:S.set.short)*6e4};save();render()},
 pause(){S.timer.ps=Date.now();save();render()},
 resume(){S.timer.pauses.push([S.timer.ps,Date.now()]);S.timer.ps=null;save();render()},
 finish(){const T=S.timer;if(T.mode==='break'){S.timer=null;save();return render()}
  if(T.ps)A.resume();const min=Math.round(elapsed(T)/6e4),k=tk(T.taskId),size=k&&k.type!=='rev'?k.p2-k.p1+1:0;
  let pg=0;if(size){pg=parseInt(prompt('كم صفحة أنجزت في هذه الجلسة؟ (0 إذا لا شيء)',0));if(!(pg>=0&&pg<=size)){alert('رقم غير صحيح، سُجّل 0 صفحة. يمكنك تسجيل الصفحات عند الضغط على "أنجزت".');pg=0}}
  const notes=prompt('ملاحظات (اختياري)')||'';
  S.sessions.push({id:uid(),taskId:T.taskId,topicId:k?k.topicId:null,startedAt:T.start,endedAt:Date.now(),pausedIntervals:T.pauses,actualMinutes:min,completedPages:pg,notes});
  S.cnt++;S.timer=null;save();S.set.auto?A.brk():render()},
 done(i){const k=tk(i),t=tp(k.topicId);
  if(k.type==='rev'){if(!confirm('تأكيد إنجاز هذه المراجعة؟'))return;k.status='done';k.donePages=0;k.doneDate=today();k.actualMinutes=S.sessions.filter(s=>s.taskId===i).reduce((a,s)=>a+s.actualMinutes,0);return replan()}
  const size=k.p2-k.p1+1,v=parseInt(prompt('كم صفحة أنجزت فعلا من '+size+'؟',size));if(!(v>=0&&v<=size))return alert('رقم غير صحيح');
  if(v===0)return alert('لم يتم تسجيل أي صفحات. استخدم "تأجيل" إن لم تذاكر.');
  k.status='done';k.donePages=v;k.doneDate=today();k.actualMinutes=S.sessions.filter(s=>s.taskId===i).reduce((a,s)=>a+s.actualMinutes,0);
  if(v<size){k.plannedP2=k.p2;k.p2=k.p1+v-1}  // the finished task records the pages really done
  t.done=Math.min(t.pages,t.done+v);if(t.done>=t.pages)t.doneDate=today();
  if(v<size)alert('سُجّلت '+v+' صفحة، وسيُعاد جدولة الباقي ('+(size-v)+' صفحة).');replan()},
 pin(i){const k=tk(i);k.pinned=!k.pinned;replan()},
 post(i){const k=tk(i);k.date=add(k.date<today()?today():k.date,1);k.pinned=true;k.postponed=(k.postponed||0)+1;replan()},
 replan(){replan()},
 behind(){const t=today();if(!S.tasks.some(x=>x.status!=='done'&&x.date<t))return alert('لا توجد مهام متأخرة.');
  propose('أنا متأخر: إعادة توزيع المهام المتأخرة',()=>{},true,'أُعيد توزيعها لتتسع الأيام القادمة')},
 applyP(){const p=P;P=null;V='today';p.mut(S);replan(p.roll)},
 cancelP(){P=null;V='today';render()},
 saveSet(){const s=S.set;s.mins=[0,1,2,3,4,5,6].map(i=>Math.max(0,parseInt($('#w'+i).value)||0));
  const n=(id,d,a,b)=>{const v=parseFloat($(id).value);return v>=a&&v<=b?v:d};

 <div class="c"><h2>استيراد أسئلة (JSON)</h2><div class="mu">اطلب من Claude أن يجهز لك الأسئلة بهذا الشكل بالضبط، واستخدم نفس أسماء مواضيعك. رقم الإجابة يبدأ من 0 (0 = الخيار الأول). وفي صح/خطأ اكتب true أو false.</div>
  <pre>[
 {"topic":"TOPIC NAME","type":"mcq","question":"Question?",
  "options":["A","B","C","D"],"answer":1,"explanation":"Short explanation"},
 {"topic":"TOPIC NAME","type":"tf","question":"Statement?","answer":true}
]</pre>
  <textarea id="qj" dir="ltr" placeholder="الصق الأسئلة هنا">${esc(QJ)}</textarea><div class="r" style="margin-top:8px"><button class="b g" data-a="qprev">معاينة وفحص</button></div>
  ${QP?`<div class="t"><b>${QP.ok.length} سؤال صالح${QP.dup?' · '+QP.dup+' مكرر سيُتجاهل':''}${QP.errs.length?' · <span class=bad>'+QP.errs.length+' فيه خطأ</span>':''}</b>${QP.errs.slice(0,30).map(e=>`<div class="bad mu">${esc(e)}</div>`).join('')}${QP.ok.length?`<div class="r" style="margin-top:8px"><button class="b" data-a="qimp">استيراد الأسئلة الصالحة (${QP.ok.length})</button></div>`:''}${QP.errs.length?'<div class="mu">الأسئلة الخاطئة لن تُستورد. صحّحها ثم اضغط معاينة من جديد.</div>':''}</div>`:''}</div>
 <div class="c"><h2>بنك الأسئلة (${live.length})</h2><div class="mu">الأسئلة مواد دراسية من إدخالك، وأنت المسؤول عن مراجعة صحتها.</div>
  ${S.topics.map(x=>({x,l:live.filter(q=>q.topicId===x.id)})).filter(o=>o.l.length).map(o=>`<details class="t"><summary>${esc(sb(o.x.subjectId)?.name)} - ${esc(o.x.name)} (${o.l.length})</summary>${o.l.map(q=>`<div class="t r"><span style="flex:1">${esc(q.text)}</span><button class="b x" data-a="delQ" data-id="${q.id}">حذف</button></div>`).join('')}</details>`).join('')||'<div class="mu">لا توجد أسئلة بعد</div>'}</div>`}
function vSet(){const s=S.set,n=(id,v,l)=>`<label class="r">${l} <input id="${id}" type="number" step="any" value="${v}"></label>`,ck=(id,v,l)=>`<label class="r"><input type="checkbox" id="${id}" ${v?'checked':''}> ${l}</label>`;
 const old=!S.lastExport||Date.now()-S.lastExport>7*864e5;
 return`<div class="c"><h2>وقت المذاكرة المتاح (دقائق لكل يوم)</h2><div class="mu">ضع 0 ليوم الراحة</div>${DAYS.map((d,i)=>n('w'+i,s.mins[i],d)).join('')}
 ${n('mpp',s.mpp,'دقائق لكل صفحة')}${n('mt',s.maxTask,'أقصى مدة للمهمة (دقيقة)')}</div>
 <div class="c"><h2>بومودورو</h2>
 <div class="r"><button class="b g" onclick="A.preset([25,5])">25/5</button><button class="b g" onclick="A.preset([45,10])">45/10</button><button class="b g" onclick="A.preset([60,15])">60/15</button></div>
 ${n('fo',s.focus,'مدة التركيز')}${n('sh',s.short,'استراحة قصيرة')}${n('lo',s.long,'استراحة طويلة')}${n('ev',s.every,'جلسات قبل الطويلة')}
 ${ck('au',s.auto,'بدء الاستراحة تلقائيا بعد إنهاء الجلسة')}${ck('so',s.sound,'صوت وتنبيه عند انتهاء الوقت (قد لا يعمل إذا كانت الشاشة مقفلة)')}</div>
 <div class="c"><h2>المراجعة التلقائية</h2><div class="mu">بعد إكمال موضوع تُضاف مراجعات كاملة له بعد هذا العدد من الأيام (مفصولة بفواصل)</div>
 ${ck('ro',s.revOn,'تفعيل المراجعة التلقائية')}<label class="r">الأيام <input id="rv" dir="ltr" style="width:180px" value="${s.rev.join(',')}"></label>
 <div class="r" style="margin-top:8px"><button class="b" data-a="saveSet">حفظ الإعدادات وإعادة الجدولة</button></div></div>
 <div class="c"><h2>النسخ الاحتياطي</h2>${old?'<div class="bad">لم تأخذ نسخة احتياطية منذ أكثر من أسبوع.</div>':''}
 <div class="mu">"تصدير" ينزّل ملفا ويعرض النص أيضا. للاستعادة اختر الملف أو الصق النص ثم اضغط "استعادة". النسخة لا تتضمن ملفات PDF.</div>
 <div class="r"><button class="b" data-a="exp">تصدير</button><label class="b g" style="display:inline-flex;align-items:center">اختيار ملف<input type="file" id="bf" accept=".json,application/json" hidden></label><button class="b g" data-a="imp">استعادة</button><button class="b g" data-a="undo">تراجع عن آخر استعادة</button></div>
 <textarea id="bk" dir="ltr" style="margin-top:8px"></textarea></div>`}
function render(){
 $('#nav').innerHTML=[['today','اليوم'],['sub','المواد والامتحانات'],['quiz','الاختبار'],['set','الإعدادات']].map(([k,l])=>`<button class="${V===k?'on':''}" data-a="tab" data-id="${k}">${l}</button>`).join('');
 $('#m').innerHTML=(warn?`<div class="c bad">${warn}</div>`:'')+(V==='prop'&&P?vProp():V==='today'?vToday():V==='sub'?vSub():V==='quiz'?vQuiz():vSet());tick()}
function tick(){const T=S&&S.timer;if(!T||!$('#rem'))return;const e=elapsed(T),r=T.dur-e;$('#rem').textContent=fmt(r);$('#el').textContent=fmt(e);
 const m=$('#msg');if(m)m.textContent=r<=0?(T.mode==='focus'?'انتهى وقت التركيز. اضغط إنهاء الجلسة وسجّل ما أنجزته.':'انتهت الاستراحة.'):'';
 if(r<=0&&!T.al&&!T.ps){T.al=1;save();beep()}}
setInterval(tick,1000);document.addEventListener('visibilitychange',tick);
(async()=>{try{S=await get('state')}catch(e){warn='التخزين غير متاح، ستضيع البيانات عند الإغلاق'}
 S=S?mig(S):fresh();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}replan()})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
